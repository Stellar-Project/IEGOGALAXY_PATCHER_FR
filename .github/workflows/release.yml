name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Extract Version
      id: get_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag.Replace("v", "")
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "Version détectée : $version"

    - name: Restore dependencies
      run: dotnet restore
      
    - name: Publish Application
      run: |
        dotnet publish IEGOGALAXY_PATCHER_FR/IEGOGALAXY_PATCHER_FR.csproj -c Release -r win-x64 --self-contained false -o ./publish /p:PublishSingleFile=true /p:Version=${{ env.VERSION }}

    - name: Compute SHA256 checksum
      id: checksum
      shell: pwsh
      run: |
        $hash = (Get-FileHash ./publish/IEGOGALAXY_PATCHER_FR.exe -Algorithm SHA256).Hash
        echo "SHA256=$hash" >> $env:GITHUB_ENV
        echo "Checksum calculé : $hash"

    - name: Generate update.xml
      shell: pwsh
      run: |
        $xml = @"
        <item>
            <version>${{ env.VERSION }}</version>
            <url>https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/IEGOGALAXY_PATCHER_FR.exe</url>
            <changelog>https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}</changelog>
            <mandatory>false</mandatory>
            <checksum algorithm="SHA256">${{ env.SHA256 }}</checksum>
        </item>
        "@
        Set-Content -Path ./update.xml -Value $xml -Encoding UTF8

    - name: Commit update.xml to master
      shell: pwsh
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin master
        git checkout master
        git add update.xml
        git commit -m "chore: update.xml pour ${{ github.ref_name }}" || echo "Rien à commit"
        git push origin master

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ./publish/IEGOGALAXY_PATCHER_FR.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}